<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMS | Sales & Inventory</title>
    <meta name="description" content="Modern Sales and Inventory Management System with real-time analytics and approval lifecycles." />
    <meta name="theme-color" content="#DCEDE6" id="theme-meta" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />

    <!-- Google Fonts: Source Serif 4 & Figtree -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap"
      rel="stylesheet"
    />

    <!-- Inline script to set theme before React renders, preventing any white flash -->
    <script>
      (function () {
        try {
          var getCookie = function(name) {
            var match = document.cookie.match(new RegExp('(^|;\\s*)' + name + '=([^;]*)'));
            return match ? decodeURIComponent(match[2]) : null;
          };
          var mode = getCookie('theme-mode') || localStorage.getItem('theme-mode') || 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.getElementById('theme-meta');
          if (meta) meta.setAttribute('content', isDark ? '#0E1A1F' : '#DCEDE6');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-bg text-text font-sans antialiased selection:bg-primary selection:text-primary-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MySQL 8.0 Database Service with InnoDB Engine & Non-Negative Stock Checks
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: sims_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: sims_db
      MYSQL_USER: sims_user
      MYSQL_PASSWORD: sims_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secure_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Mailpit Mock SMTP Server & Web Inspection Dashboard
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: sims_mailpit
    restart: always
    ports:
      - "1025:1025"   # SMTP port for FastAPI background tasks
      - "8025:8025"   # Interactive web dashboard to inspect sent emails
    environment:
      MP_MAX_MESSAGES: 500

  # ----------------------------------------------------------------------------
  # FastAPI Backend Service (Runs Alembic migration, Idempotent Seed, Uvicorn)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sims_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DATABASE_URL: mysql+pymysql://sims_user:sims_password@mysql:3306/sims_db
      JWT_SECRET_KEY: 09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      JWT_REFRESH_SECRET_KEY: 87b9201f114c0a52f9543e33fbe4d9b23a54b38d381014e7811dc31f8b4d89e2
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: notifications@sims.local
      EMAILS_FROM_NAME: SIMS Notifications
      DEFAULT_APPROVAL_THRESHOLD: "75000.00"
      CURRENCY_CODE: "INR"
      CURRENCY_LOCALE: "en-IN"
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:80
    ports:
      - "8000:8000"

  # ----------------------------------------------------------------------------
  # React Frontend Service (Multi-stage Vite build served via Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sims_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
    driver: local
